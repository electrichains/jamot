# Jamot — Render Blueprint
# Deploys the API, the Next.js web app, a scheduler worker, Postgres and Redis.
# Validation: render blueprints validate

projects:
  - name: jamot
    environments:
      - name: production
        databases:
          - name: jamot-db
            plan: starter
            region: oregon

        services:
          - type: web
            name: jamot-api
            runtime: node
            region: oregon
            plan: starter
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jamot/api build
            startCommand: pnpm --filter @jamot/api start
            healthCheckPath: /health
            buildFilter:
              paths:
                - packages/api/**
                - packages/core/**
                - packages/contracts/**
                - packages/sdk/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
              - key: SECRET_ENCRYPTION_KEY
                generateValue: true
              - key: CORS_ORIGIN
                value: https://jamot-web.onrender.com
              - key: FRONTEND_URL
                value: https://jamot-web.onrender.com
              - key: WA_WORKER_URL
                value: http://jamot-channels:10000
              - key: NODE_ENV
                value: production
              # Grant-only super admins; comma-separated emails. Leave empty unless you
              # want to grant full platform super-admin access to specific accounts.
              - key: SUPER_ADMIN_EMAILS
                value: ""

          - type: web
            name: jamot-web
            runtime: node
            region: oregon
            plan: starter
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jamot/web build
            startCommand: pnpm --filter @jamot/web start
            buildFilter:
              paths:
                - apps/web/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: NEXT_PUBLIC_API_URL
                value: https://jamot-api.onrender.com

          - type: worker
            name: jamot-scheduler
            runtime: node
            region: oregon
            plan: starter
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/scheduler.ts
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: jamot-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jamot-redis
                  property: connectionString

          - type: pserv
            name: jamot-channels
            runtime: node
            region: oregon
            plan: starter
            buildCommand: pnpm install --frozen-lockfile && pnpm --filter @jamot/workers build
            startCommand: pnpm --filter @jamot/workers exec tsx src/channel.ts
            disk:
              name: wa-session
              mountPath: /data
              sizeGB: 1
            buildFilter:
              paths:
                - packages/workers/**
                - packages/core/**
                - packages/contracts/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
            envVars:
              - key: WHATSAPP_SESSION_DIR
                value: /data/whatsapp
              # The control server binds this port; must match WA_WORKER_URL on the API.
              - key: WA_CONTROL_PORT
                value: "10000"
              - key: NODE_ENV
                value: production

          - type: keyvalue
            name: jamot-redis
            plan: starter
            maxmemoryPolicy: noeviction
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
